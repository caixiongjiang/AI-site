name: Deploy AI-site (JP)

on:
  push:
    branches: [jp_model_lake_adapt]
  workflow_dispatch:

concurrency:
  group: deploy-ai-site-jp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AI-site to JP
    runs-on: [self-hosted, jp]
    steps:
      - name: Deploy AI-site JP
        run: |
          set -euo pipefail
          cd "${{ secrets.JP_DEPLOY_PATH }}"

          echo "========================================="
          echo "Deploying AI-site to JP (192.168.19.12)"
          echo "========================================="

          git fetch origin jp_model_lake_adapt
          git checkout jp_model_lake_adapt
          git pull origin jp_model_lake_adapt

          test -f .env.jp || { echo "missing .env.jp on the JP server"; exit 1; }
          test -f docker-compose.jp.yml || { echo "missing docker-compose.jp.yml"; exit 1; }

          docker compose -f docker-compose.jp.yml up -d --build
          docker image prune -f

          echo "AI-site JP deployed at $(date)"
          echo "Web: http://192.168.19.12:4001"
